<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rifiuto richiesta - Shlend</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
        }

        p {
            line-height: 1.5;
        }

        .reason-button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #dc3545;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reason-button:hover {
            opacity: 0.9;
        }

        #otherBox {
            display: none;
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        #confirmButton {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

        #success {
            display: none;
            text-align: center;
        }

        #success h2 {
            color: #198754;
        }
    </style>
</head>

<body>

<div class="container" id="mainBox">

    <h1>Rifiuta richiesta</h1>

    <p>
        Seleziona il motivo per cui vuoi rifiutare questa richiesta:
    </p>

    <button
        class="reason-button"
        onclick="inviaRifiuto('Data non disponibile')">
        Data non disponibile
    </button>

    <button
        class="reason-button"
        onclick="inviaRifiuto('Orario non disponibile')">
        Orario non disponibile
    </button>

    <button
        class="reason-button"
        onclick="mostraAltro()">
        Altro
    </button>

    <div id="otherBox">

        <textarea
            id="motivoAltro"
            placeholder="Scrivi il motivo del rifiuto..."></textarea>

        <button
            id="confirmButton"
            onclick="inviaAltro()">
            Conferma rifiuto
        </button>

    </div>

    <div class="info">
        La richiesta verrà aggiornata automaticamente.
    </div>

</div>


<div class="container" id="success">

    <h2>Rifiuto registrato</h2>

    <p>
        La richiesta è stata rifiutata correttamente.
    </p>

    <p>
        Il motivo del rifiuto è stato registrato.
    </p>

</div>


<!-- Iframe nascosto che riceve la risposta di Activepieces -->
<iframe
    name="hiddenFrame"
    id="hiddenFrame"
    style="display:none;">
</iframe>


<script>

    const webhook =
        "https://cloud.activepieces.com/api/v1/webhooks/77I35a0lKgE27zcXTZGkj";


    const parametri =
        new URLSearchParams(window.location.search);

    const riga =
        parametri.get("riga");


    function mostraAltro() {

        document.getElementById("otherBox").style.display = "block";

    }


    function inviaRifiuto(motivo) {

        if (!riga) {

            alert("Numero della riga non presente.");

            return;
        }


        const form =
            document.createElement("form");


        form.method = "POST";

        form.action = webhook;

        form.target = "hiddenFrame";


        const azioneInput =
            document.createElement("input");

        azioneInput.type = "hidden";

        azioneInput.name = "azione";

        azioneInput.value = "rifiuta";


        const rigaInput =
            document.createElement("input");

        rigaInput.type = "hidden";

        rigaInput.name = "riga";

        rigaInput.value = riga;


        const motivoInput =
            document.createElement("input");

        motivoInput.type = "hidden";

        motivoInput.name = "motivo";

        motivoInput.value = motivo;


        form.appendChild(azioneInput);

        form.appendChild(rigaInput);

        form.appendChild(motivoInput);


        document.body.appendChild(form);


        form.submit();


        // Mostra la conferma all'utente
        setTimeout(function() {

            document.getElementById("mainBox").style.display = "none";

            document.getElementById("success").style.display = "block";

        }, 800);

    }


    function inviaAltro() {

        const motivo =
            document.getElementById("motivoAltro").value.trim();


        if (!motivo) {

            alert("Inserisci il motivo del rifiuto.");

            return;
        }


        inviaRifiuto(motivo);

    }

</script>

</body>
</html>
